<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">repo2txt</title>
  <desc id="description">Convert repositories to plain text for LLMs</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.52" stop-color="#172554" />
      <stop offset="1" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="cat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1100" cy="80" r="330" fill="url(#glow)" />
  <circle cx="140" cy="610" r="270" fill="url(#glow)" opacity="0.45" />

  <g opacity="0.12" fill="#e0f2fe">
    <circle cx="64" cy="66" r="3" />
    <circle cx="114" cy="66" r="3" />
    <circle cx="164" cy="66" r="3" />
    <circle cx="214" cy="66" r="3" />
    <circle cx="264" cy="66" r="3" />
    <circle cx="314" cy="66" r="3" />
    <circle cx="364" cy="66" r="3" />
  </g>

  <rect x="72" y="139" width="304" height="304" rx="64" fill="#ffffff" fill-opacity="0.08" stroke="#bae6fd" stroke-opacity="0.22" stroke-width="2" />

  <g transform="translate(84 145) scale(2.8)">
    <ellipse cx="50" cy="55" rx="28" ry="26" fill="url(#cat)" />
    <path d="M30 35 25 20 38 32Z" fill="url(#cat)" />
    <path d="M70 35 75 20 62 32Z" fill="url(#cat)" />
    <path d="M30 35 28 26 35 34Z" fill="#e0e7ff" />
    <path d="M70 35 72 26 65 34Z" fill="#e0e7ff" />
    <ellipse cx="40" cy="52" rx="4" ry="6" fill="#1f2937" />
    <ellipse cx="41" cy="51" rx="1.5" ry="2" fill="#ffffff" />
    <ellipse cx="60" cy="52" rx="4" ry="6" fill="#1f2937" />
    <ellipse cx="61" cy="51" rx="1.5" ry="2" fill="#ffffff" />
    <path d="m50 58-2 4h4Z" fill="#ec4899" />
    <path d="M50 62q-5 4-8 2M50 62q5 4 8 2" fill="none" stroke="#1f2937" stroke-linecap="round" stroke-width="1.5" />
    <path d="M24 54h11M24 58l11-1M24 62l11-2M76 54H65M76 58l-11-1M76 62l-11-2" fill="none" stroke="#1f2937" stroke-linecap="round" />
    <rect x="36" y="72" width="28" height="16" rx="2" fill="#e0e7ff" fill-opacity="0.9" />
    <path d="M40 77h20M40 81h16M40 85h18" fill="none" stroke="#4f46e5" stroke-linecap="round" stroke-width="1.5" />
  </g>

  <text x="430" y="235" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="750" letter-spacing="-3">repo2txt</text>
  <text x="432" y="303" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="650">Repository context, ready for AI</text>
  <text x="432" y="371" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Convert repositories and local projects</text>
  <text x="432" y="411" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">into clean, copy-ready plain text.</text>

  <g transform="translate(432 470)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">
    <rect width="152" height="46" rx="23" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.13" />
    <text x="76" y="30" fill="#e0f2fe" text-anchor="middle">Browser-based</text>
    <rect x="170" width="138" height="46" rx="23" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.13" />
    <text x="239" y="30" fill="#e0f2fe" text-anchor="middle">Open source</text>
  </g>
